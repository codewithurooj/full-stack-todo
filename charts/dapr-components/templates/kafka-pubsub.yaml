{{- if .Values.pubsub.enabled }}
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.pubsub.name }}
  namespace: {{ .Release.Namespace }}
spec:
  type: pubsub.kafka
  version: v1
  metadata:
  - name: brokers
    value: {{ .Values.pubsub.kafkaBrokers | quote }}
  - name: consumerGroup
    value: "todo-app-consumers"
  - name: maxMessageBytes
    value: {{ .Values.pubsub.maxMessageBytes | quote }}
  - name: initialOffset
    value: "oldest"
  {{- if .Values.pubsub.sasl.enabled }}
  - name: authRequired
    value: "true"
  - name: saslMechanism
    value: {{ .Values.pubsub.sasl.mechanism | quote }}
  - name: saslUsername
    secretKeyRef:
      name: kafka-credentials
      key: username
  - name: saslPassword
    secretKeyRef:
      name: kafka-credentials
      key: password
  {{- end }}
  {{- if .Values.pubsub.tls.enabled }}
  - name: tls
    value: "true"
  {{- end }}
{{- end }}
