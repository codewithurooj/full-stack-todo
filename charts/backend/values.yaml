# Default values for todo-backend
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: todo-backend
  pullPolicy: Never  # Use local images in Minikube
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  name: ""

podAnnotations: {}

# Dapr configuration (Feature 012)
dapr:
  enabled: false
  appId: "backend-service"
  appPort: "8000"
  enableApiLogging: "true"
  logLevel: "info"
  config: "daprsystem"
  # Components for this service
  components:
    pubsub: "kafka-pubsub"
    statestore: "statestore"
    secretstore: "kubernetes-secrets"

podSecurityContext: {}
  # runAsNonRoot: true
  # runAsUser: 1001
  # fsGroup: 1001

securityContext: {}
  # allowPrivilegeEscalation: false
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000
  annotations: {}

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: todo.local
      paths:
        - path: /api
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Environment variables
env:
  - name: ENVIRONMENT
    value: "production"

# Environment variables from ConfigMap
envFrom:
  - configMapRef:
      name: todo-backend-config
  - secretRef:
      name: todo-backend-secret

# Configuration values (non-sensitive)
config:
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"

# Secret values (sensitive)
secrets:
  DATABASE_URL: "postgresql://user:password@neon.host/dbname"
  BETTER_AUTH_SECRET: "your-secret-key-min-32-chars-change-in-production"
  OPENAI_API_KEY: "sk-your-openai-api-key"

# Health checks
livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
