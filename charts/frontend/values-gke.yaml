# Google Cloud GKE-specific values for todo-frontend
# Deploy with: helm upgrade --install todo-frontend ./charts/frontend -n todo-app -f charts/frontend/values-gke.yaml

replicaCount: 2

image:
  # Replace with your GCP project and region
  # Example: us-central1-docker.pkg.dev/my-project/todo-repo/todo-frontend
  repository: <region>-docker.pkg.dev/<project-id>/todo-repo/todo-frontend
  pullPolicy: Always
  tag: "latest"

# GKE nodes have implicit access to Artifact Registry in same project
imagePullSecrets: []

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: todo.yourdomain.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: todo-frontend-tls
      hosts:
        - todo.yourdomain.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# GKE node selector for specific node pool (optional)
nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - todo-frontend
          topologyKey: kubernetes.io/hostname

# Environment variables
env:
  - name: NEXT_PUBLIC_API_URL
    value: "https://todo.yourdomain.com"
  - name: NODE_ENV
    value: "production"

# Environment variables from ConfigMap/Secrets
envFrom:
  - configMapRef:
      name: todo-frontend-config
  - secretRef:
      name: todo-frontend-secret

# Configuration values (non-sensitive)
config:
  NEXT_PUBLIC_API_URL: "https://todo.yourdomain.com"
  NODE_ENV: "production"

# Secrets are created separately via kubectl or GCP Secret Manager
secrets: {}
