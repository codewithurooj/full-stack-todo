# Kubernetes Secret: Kafka Credentials
# Feature: 012-dapr-integration
# Purpose: Kafka/Redpanda authentication for event streaming

apiVersion: v1
kind: Secret
metadata:
  name: kafka-credentials
  namespace: default
  labels:
    app.kubernetes.io/part-of: todo-app
    feature: 012-dapr-integration
type: Opaque
stringData:
  # Kafka broker addresses
  brokers: "localhost:19092"

  # SASL authentication (leave empty for local development)
  username: ""
  password: ""

---
# IMPORTANT: Replace placeholder values before applying!
# kubectl apply -f kafka-credentials.yaml
#
# For production with Redpanda Cloud:
# kubectl create secret generic kafka-credentials \
#   --from-literal=brokers="your-redpanda-broker:9092" \
#   --from-literal=username="your-username" \
#   --from-literal=password="your-password"
#
# For local development with Redpanda in Docker:
# kubectl create secret generic kafka-credentials \
#   --from-literal=brokers="redpanda:9092" \
#   --from-literal=username="" \
#   --from-literal=password=""
