# Kubernetes Secret: PostgreSQL Credentials
# Feature: 012-dapr-integration
# Purpose: Database connection string for all services

apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: default
  labels:
    app.kubernetes.io/part-of: todo-app
    feature: 012-dapr-integration
type: Opaque
stringData:
  # Full PostgreSQL connection string (Neon Serverless)
  connectionString: "postgresql://user:password@host.neon.tech:5432/dbname?sslmode=require"

---
# IMPORTANT: Replace placeholder values before applying!
# kubectl apply -f postgres-credentials.yaml
#
# Or create from command line:
# kubectl create secret generic postgres-credentials \
#   --from-literal=connectionString="postgresql://user:pass@host:5432/db?sslmode=require"
