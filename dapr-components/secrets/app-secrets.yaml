# Kubernetes Secret: Application Secrets
# Feature: 012-dapr-integration
# Purpose: Store sensitive application configuration

apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: default
  labels:
    app.kubernetes.io/part-of: todo-app
    feature: 012-dapr-integration
type: Opaque
stringData:
  # OpenAI API Key for chat functionality
  OPENAI_API_KEY: "sk-your-openai-api-key"

  # Better Auth secret for JWT signing
  BETTER_AUTH_SECRET: "your-32-character-secret-key-here"

  # VAPID keys for Web Push notifications
  VAPID_PRIVATE_KEY: "your-vapid-private-key"
  VAPID_PUBLIC_KEY: "your-vapid-public-key"

  # VAPID subject (contact email)
  VAPID_SUBJECT: "mailto:admin@example.com"

---
# IMPORTANT: Replace placeholder values before applying!
# kubectl apply -f app-secrets.yaml
#
# Or create from command line:
# kubectl create secret generic app-secrets \
#   --from-literal=OPENAI_API_KEY="sk-..." \
#   --from-literal=BETTER_AUTH_SECRET="your-secret" \
#   --from-literal=VAPID_PRIVATE_KEY="..." \
#   --from-literal=VAPID_PUBLIC_KEY="..."
