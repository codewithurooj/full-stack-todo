[pytest]
# Pytest configuration for AI-powered DevOps tools

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = .

# Output options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=../scripts
    --cov-report=term-missing
    --cov-report=html
    --cov-branch

# Markers
markers =
    unit: Unit tests
    integration: Integration tests with external services
    slow: Slow tests that take >1 second
    kubectl: Tests for kubectl-ai
    kagent: Tests for kagent
    dockerai: Tests for docker-ai

# Coverage options
[coverage:run]
source = ../scripts
omit =
    */tests/*
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
