# ServiceMonitor for todo-frontend
# Requires Prometheus Operator (installed via kube-prometheus-stack)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: todo-frontend
  namespace: todo-app
  labels:
    app.kubernetes.io/name: todo-frontend
    app.kubernetes.io/part-of: full-stack-todo
    release: kube-prometheus  # Must match Prometheus selector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: todo-frontend
  namespaceSelector:
    matchNames:
      - todo-app
  endpoints:
    - port: http
      path: /api/metrics  # Next.js metrics endpoint if configured
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
