apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: todo-app-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus
spec:
  groups:
    - name: todo_app_health
      interval: 30s
      rules:
        - alert: TodoBackendDown
          expr: up{job="todo-backend"} == 0
          for: 2m
          labels:
            severity: critical
            component: backend
          annotations:
            summary: "Todo backend is down"
            description: "Todo backend has been unreachable for 2 minutes"

        - alert: TodoFrontendDown
          expr: up{job="todo-frontend"} == 0
          for: 2m
          labels:
            severity: critical
            component: frontend
          annotations:
            summary: "Todo frontend is down"
            description: "Todo frontend has been unreachable for 2 minutes"

        - alert: HighPodRestarts
          expr: increase(kube_pod_container_status_restarts_total{namespace="todo-app"}[1h]) > 3
          for: 5m
          labels:
            severity: warning
            component: pods
          annotations:
            summary: "High pod restart rate"
            description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last hour"

        - alert: PodNotReady
          expr: kube_pod_status_ready{namespace="todo-app", condition="true"} == 0
          for: 5m
          labels:
            severity: warning
            component: pods
          annotations:
            summary: "Pod not ready"
            description: "Pod {{ $labels.pod }} in namespace todo-app has been not ready for 5 minutes"

        - alert: HighCPUUsage
          expr: |
            sum(rate(container_cpu_usage_seconds_total{namespace="todo-app"}[5m])) by (pod)
            / sum(kube_pod_container_resource_limits{namespace="todo-app", resource="cpu"}) by (pod)
            > 0.8
          for: 5m
          labels:
            severity: warning
            component: resources
          annotations:
            summary: "High CPU usage"
            description: "Pod {{ $labels.pod }} CPU usage is above 80%"

        - alert: HighMemoryUsage
          expr: |
            sum(container_memory_working_set_bytes{namespace="todo-app"}) by (pod)
            / sum(kube_pod_container_resource_limits{namespace="todo-app", resource="memory"}) by (pod)
            > 0.85
          for: 5m
          labels:
            severity: warning
            component: resources
          annotations:
            summary: "High memory usage"
            description: "Pod {{ $labels.pod }} memory usage is above 85%"
