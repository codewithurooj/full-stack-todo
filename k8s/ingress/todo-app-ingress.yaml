# Combined Ingress for Todo Application
# This manifest provides a single entry point for the full-stack application
# with automatic TLS certificate management via cert-manager
#
# Prerequisites:
# 1. NGINX Ingress Controller installed
# 2. cert-manager installed and ClusterIssuer created
# 3. DNS A record pointing to LoadBalancer IP
#
# Apply with: kubectl apply -f k8s/ingress/todo-app-ingress.yaml

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-app-ingress
  namespace: todo-app
  labels:
    app.kubernetes.io/name: todo-app
    app.kubernetes.io/component: ingress
    app.kubernetes.io/managed-by: kubectl
  annotations:
    # TLS Certificate Management
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # NGINX Ingress Controller annotations
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"

    # Rate limiting (optional - uncomment to enable)
    # nginx.ingress.kubernetes.io/limit-rps: "10"
    # nginx.ingress.kubernetes.io/limit-connections: "5"

    # CORS configuration
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - 135.235.185.11.nip.io
      secretName: todo-app-tls
  rules:
    - host: 135.235.185.11.nip.io
      http:
        paths:
          # Backend API routes
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: todo-backend
                port:
                  number: 8000

          # Health check endpoint (for monitoring)
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: todo-backend
                port:
                  number: 8000

          # API documentation
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: todo-backend
                port:
                  number: 8000

          - path: /openapi.json
            pathType: Prefix
            backend:
              service:
                name: todo-backend
                port:
                  number: 8000

          # Frontend (catch-all for everything else)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todo-frontend
                port:
                  number: 3000

---
# NetworkPolicy to restrict traffic to ingress controller only
# This adds security by ensuring only the ingress controller can reach the services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-only
  namespace: todo-app
  labels:
    app.kubernetes.io/name: todo-app
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: full-stack-todo
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic from NGINX Ingress Controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 3000
    # Allow internal service-to-service communication
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: todo-app
