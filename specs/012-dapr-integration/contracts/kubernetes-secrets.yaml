# Dapr Secrets Component: Kubernetes Secrets
# Feature: 012-dapr-integration
# Purpose: Secure secret retrieval from Kubernetes

apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kubernetes-secrets
  namespace: default
  labels:
    app.kubernetes.io/part-of: todo-app
    feature: 012-dapr-integration
spec:
  type: secretstores.kubernetes
  version: v1
  metadata: []
  # Kubernetes secrets component requires no additional metadata
  # Access is controlled via Kubernetes RBAC

# No scopes - all services can access secrets they're authorized for
# RBAC controls actual access at the Kubernetes level

---
# Required Kubernetes Secrets (to be created separately)

# Secret 1: Application secrets
# kubectl create secret generic app-secrets \
#   --from-literal=OPENAI_API_KEY="sk-..." \
#   --from-literal=BETTER_AUTH_SECRET="your-32-char-secret" \
#   --from-literal=VAPID_PRIVATE_KEY="..." \
#   --from-literal=VAPID_PUBLIC_KEY="..."

# Secret 2: PostgreSQL credentials
# kubectl create secret generic postgres-credentials \
#   --from-literal=connectionString="postgresql://user:pass@host/db?sslmode=require"

# Secret 3: Kafka credentials
# kubectl create secret generic kafka-credentials \
#   --from-literal=brokers="kafka:9092" \
#   --from-literal=username="kafka-user" \
#   --from-literal=password="kafka-password"
