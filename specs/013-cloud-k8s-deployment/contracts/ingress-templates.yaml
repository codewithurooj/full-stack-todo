---
# ==============================================
# CORS Configuration for API
# ==============================================
# If frontend and backend need different CORS settings

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-backend-ingress
  namespace: todo-app
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

    # CORS headers for API
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://todo.yourdomain.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"

spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.todo.yourdomain.com
      secretName: todo-api-tls-secret
  rules:
    - host: api.todo.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todo-backend
                port:
                  number: 8000

---
# ==============================================
# Namespace Definition
# ==============================================

apiVersion: v1
kind: Namespace
metadata:
  name: todo-app
  labels:
    app.kubernetes.io/name: todo-app
    app.kubernetes.io/part-of: todo-system
  annotations:
    description: "Full-stack Todo Application namespace"

---
# ==============================================
# Network Policy (Optional Security)
# ==============================================
# Restrict traffic to only allow ingress controller to reach services

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-services
  namespace: todo-app
spec:
  podSelector: {}  # Applies to all pods in namespace
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic from ingress-nginx namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000  # Frontend
        - protocol: TCP
          port: 8000  # Backend

    # Allow internal service-to-service communication
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 3000

---
# ==============================================
# NGINX Ingress Controller Installation Reference
# ==============================================

# Install NGINX Ingress Controller for cloud providers:

# Generic cloud (Azure, GCP, Oracle)
# kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.1/deploy/static/provider/cloud/deploy.yaml

# Get the LoadBalancer external IP
# kubectl get svc -n ingress-nginx ingress-nginx-controller

# Expected output:
# NAME                       TYPE           CLUSTER-IP     EXTERNAL-IP    PORT(S)
# ingress-nginx-controller   LoadBalancer   10.0.xxx.xxx   <PUBLIC-IP>    80:xxxxx/TCP,443:xxxxx/TCP

# Configure DNS A record:
# todo.yourdomain.com → <PUBLIC-IP>

# Verify installation:
# kubectl get pods -n ingress-nginx
# kubectl logs -n ingress-nginx -l app.kubernetes.io/name=ingress-nginx

