# Kubernetes Ingress Templates
# Feature: 013-cloud-k8s-deployment
# Purpose: HTTPS traffic routing with TLS termination
# Status: Contract/Template - To be implemented in charts/*/templates/ingress.yaml

---
# ==============================================
# Single Ingress with Path-Based Routing
# ==============================================
# Recommended approach: Single Ingress routes traffic to both frontend and backend

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-app-ingress
  namespace: todo-app
  labels:
    app.kubernetes.io/name: todo-app
    app.kubernetes.io/component: ingress
  annotations:
    # TLS Certificate Management
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # NGINX Ingress Controller settings
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"

    # Security Headers (HSTS)
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"

    # Rate Limiting (optional)
    # nginx.ingress.kubernetes.io/limit-rps: "10"
    # nginx.ingress.kubernetes.io/limit-connections: "5"

spec:
  ingressClassName: nginx

  # TLS Configuration
  tls:
    - hosts:
        - todo.yourdomain.com
      secretName: todo-app-tls-secret

  # Routing Rules
  rules:
    - host: todo.yourdomain.com
      http:
        paths:
          # API routes to backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: todo-backend
                port:
                  number: 8000

          # Health endpoint for monitoring
          - path: /health
            pathType: Exact
            backend:
              service:
                name: todo-backend
                port:
                  number: 8000

          # All other routes to frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todo-frontend
                port:
                  number: 3000

